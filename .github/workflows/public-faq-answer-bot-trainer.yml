name: public-faq-answer-bot-trainer tests

on:
  push:
    paths:
      - "public-faq-answer-bot-trainer/**"
      - ".github/workflows/public-faq-answer-bot-trainer.yml"
  pull_request:
    paths:
      - "public-faq-answer-bot-trainer/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-faq-answer-bot-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -m "not slow"
