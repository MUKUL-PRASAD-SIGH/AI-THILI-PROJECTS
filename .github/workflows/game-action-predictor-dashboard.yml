name: game-action-predictor-dashboard tests

on:
  push:
    paths:
      - "game-action-predictor-dashboard/**"
      - ".github/workflows/game-action-predictor-dashboard.yml"
  pull_request:
    paths:
      - "game-action-predictor-dashboard/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-action-predictor-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest
